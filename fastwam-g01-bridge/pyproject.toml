[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastwam-g01-bridge"
version = "0.1.0"
description = "Bridge G01 GDK observations to FastWAM /infer and dispatch actions."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.28.0",
  "numpy>=1.24.0",
  "opencv-python-headless>=4.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
fastwam-g01-bridge = "fastwam_g01_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fastwam_g01_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
